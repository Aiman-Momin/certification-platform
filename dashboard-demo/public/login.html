<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalachain Admin — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-950: #0a1c33;
    --navy-900: #0f2a4a;
    --navy-800: #163b62;
    --navy-300: #93a9c3;
    --gold-700: #8a5a1f;
    --gold-600: #a8752f;
    --gold-500: #c1893a;
    --border: #e1e6ee;
    --ink: #16233a;
    --muted: #64748b;
    --red-700: #9c3131;
    --red-100: #fbe7e7;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background:
      radial-gradient(900px 500px at 15% 10%, rgba(193,137,58,0.10), transparent 60%),
      radial-gradient(1000px 600px at 85% 90%, rgba(28,70,116,0.35), transparent 55%),
      linear-gradient(180deg, var(--navy-950), var(--navy-900));
    color: var(--ink);
  }

  .login-card {
    background: #ffffff;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 14px;
    padding: 40px 36px 34px;
    width: 100%; max-width: 380px;
    box-shadow: 0 30px 60px -25px rgba(6, 15, 30, 0.55);
  }

  .brand-logo {
    display: block;
    width: 48px; height: 48px; margin: 0 auto 18px;
    object-fit: contain;
    border-radius: 10px;
    background: #fff;
    padding: 5px;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
  }

  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    color: var(--navy-900);
    margin: 0 0 4px;
    text-align: center;
  }
  .subtitle {
    color: var(--muted); font-size: 13px; margin-bottom: 28px;
    text-align: center;
  }

  label {
    display: block; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; padding: 11px 13px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: var(--font-body);
    background: #fbfcfe;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--gold-500);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(193, 137, 58, 0.16);
  }

  button {
    width: 100%; margin-top: 26px;
    background: linear-gradient(180deg, var(--navy-800), var(--navy-900));
    color: white; border: none;
    border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 10px 22px -12px rgba(15,42,74,0.6);
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

  .error-msg {
    color: var(--red-700); font-size: 13px; text-align: center;
    min-height: 16px; margin-top: 14px; border-radius: 7px;
  }
  .error-msg:not(:empty) { background: var(--red-100); padding: 8px 10px; }
</style>
</head>
<body>
  <div class="login-card">
    
    <h1>Kalachain Admin</h1>
    <div class="subtitle">Sign in to manage certifications</div>
    <form id="login-form">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submit-btn">Sign In</button>
      <div class="error-msg" id="error-msg"></div>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // --- Same Supabase project as the rest of the app ---
  const SUPABASE_URL = "https://cerszoqebrpwjbeiooxt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNlcnN6b3FlYnJwd2piZWlvb3h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNzgzNDEsImV4cCI6MjEwMDg1NDM0MX0.SDGcTSCcE1IPx_Q8bGeFqyWbcdYWisc-okA4fHPgSDc";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // If already logged in, skip straight to the dashboard
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "index.html";
  })();

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error-msg");
    const btn = document.getElementById("submit-btn");
    errorEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Signing in...";

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      // Deliberately generic message -- doesn't reveal whether the email
      // exists or not, so this can't be used to fish for valid admin emails.
      errorEl.textContent = "Incorrect email or password.";
      btn.disabled = false;
      btn.textContent = "Sign In";
      return;
    }

    window.location.href = "index.html";
  });
</script>
</body>
</html>
