<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification - Kalachain</title>
<style>
  :root {
    --primary-bg: #f8fafc;
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --accent-gold: #b45309;
    --border-color: #e2e8f0;
    --panel-bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--primary-bg);
    color: var(--text-main);
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }
  .certificate-container {
    background-color: var(--card-bg);
    max-width: 850px;
    width: 100%;
    padding: 50px;
    border: 12px double #cbd5e1;
    border-radius: 4px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    position: relative;
  }
  .certificate-container::before {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid #e2e8f0; pointer-events: none;
  }
  .header { text-align: center; margin-bottom: 40px; }
  .academy-name { font-size: 28px; font-weight: 700; letter-spacing: 2px; color: var(--text-main); margin: 0 0 5px; text-transform: uppercase; }
  .cert-title { font-size: 16px; letter-spacing: 4px; color: var(--accent-gold); text-transform: uppercase; font-weight: 600; margin: 0; }
  .recipient-section { text-align: center; margin-bottom: 35px; }
  .statement { font-style: italic; color: var(--text-muted); margin-bottom: 10px; font-size: 16px; }
  .name { font-size: 32px; font-weight: 700; color: var(--text-main); border-bottom: 2px solid #e2e8f0; display: inline-block; padding-bottom: 5px; margin-bottom: 15px; }
  .course { font-size: 18px; font-weight: 600; color: var(--text-main); margin: 5px 0; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; padding: 15px; background-color: var(--panel-bg); border-radius: 6px; border: 1px solid var(--border-color); }
  .meta-item { font-size: 14px; }
  .meta-label { color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 2px; }
  .meta-value { color: var(--text-main); font-weight: 600; }
  .grade-badge { color: var(--accent-gold); font-weight: 700; }
  .section-title { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 8px; margin-bottom: 20px; font-weight: 600; }
  .evaluator-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; margin-bottom: 20px; }
  .evaluator-info { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .evaluator-name { font-weight: 600; font-size: 16px; color: var(--text-main); margin: 0; }
  .evaluator-title { font-size: 13px; color: var(--text-muted); margin: 2px 0 0; }
  .transcript-box { font-size: 14px; line-height: 1.5; color: var(--text-main); background-color: var(--panel-bg); padding: 12px; border-left: 3px solid var(--accent-gold); border-radius: 0 4px 4px 0; margin-bottom: 12px; font-style: italic; }
  .hash-line { font-family: monospace; font-size: 12px; color: var(--text-muted); word-break: break-all; }
  .audio-player { width: 240px; height: 32px; }
  .blockchain-footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-muted); }
  .hosted-by { text-align: left; font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .hosted-by strong { color: var(--text-main); }
  .footer-row { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 6px; }
  .tx-hash { font-family: monospace; word-break: break-all; background-color: var(--panel-bg); padding: 6px 10px; border-radius: 4px; margin-top: 4px; display: block; }
  .state-message { text-align: center; color: var(--text-muted); font-size: 16px; padding: 60px 20px; }
  .state-message.error { color: #a13a3a; }
</style>
</head>
<body>
  <div class="certificate-container" id="certificate-root">
    <div class="state-message" id="loading-state">Loading certificate...</div>
  </div>

<script>
  // Metadata JSON files (written by the mint scripts) are published here.
  const METADATA_BASE_URL = "./data/";

  function getTokenIdFromUrl() {
    return new URLSearchParams(window.location.search).get("id");
  }

  function showError(message) {
    document.getElementById("certificate-root").innerHTML =
      `<div class="state-message error"><strong>Certificate not found.</strong><br><br>${message}</div>`;
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function attr(meta, traitType) {
    const found = (meta.attributes || []).find(a => a.trait_type === traitType);
    return found ? found.value : "";
  }

  function renderCertificate(meta) {
    const isEvaluation = attr(meta, "Certificate Type") === "Evaluation";
    const eventName = (meta.name || "").replace(/^(Evaluation|Participation) Certificate - /, "");
    const issueDate = new Date(meta.issuedAt).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

    const gradeRow = isEvaluation ? `
        <div class="meta-item">
            <span class="meta-label">Grading Evaluation Tier</span>
            <span class="meta-value grade-badge">${escapeHtml(meta.marksAndGrade?.grade || "")} (${escapeHtml(String(meta.marksAndGrade?.totalMarks || ""))}/${escapeHtml(String(meta.marksAndGrade?.maxMarks || ""))})</span>
        </div>` : "";

    const voiceSection = isEvaluation ? `
    <h2 class="section-title">Official Evaluator Voice Feedback (On-Chain Record)</h2>
    <div class="evaluator-card">
        <div class="evaluator-info">
            <div>
                <h3 class="evaluator-name">${escapeHtml(meta.evaluatorName || "")}</h3>
                <p class="evaluator-title">${escapeHtml(meta.evaluatorTitle || "Evaluator")}</p>
            </div>
            <audio class="audio-player" controls preload="none" src="${meta.audioFeedbackUrl || ""}"></audio>
        </div>
        <div class="transcript-box">"${escapeHtml(meta.comments || "")}"</div>
        <div class="hash-line"><strong>Audio Feedback Reference:</strong> ${escapeHtml(meta.audioFeedbackUrl || "")}</div>
    </div>` : "";

    document.getElementById("certificate-root").innerHTML = `
    <div class="header">
        <h1 class="academy-name">Kalachain</h1>
        <p class="cert-title">Certificate of ${isEvaluation ? "Evaluation" : "Excellence"}</p>
    </div>

    <div class="recipient-section">
        <p class="statement">This is officially compiled to verify that</p>
        <div class="name">${escapeHtml(meta.participant?.name || "")}</div>
        <p class="statement">has successfully completed</p>
        <p class="course">${escapeHtml(eventName)}</p>
    </div>

    <div class="meta-grid">
        ${gradeRow}
        <div class="meta-item">
            <span class="meta-label">Official Issue Date</span>
            <span class="meta-value">${issueDate}</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Verification Record ID</span>
            <span class="meta-value">Token #${escapeHtml(String(meta.tokenId))}</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Ledger Network Track</span>
            <span class="meta-value">${escapeHtml(meta.network || "")} (Polygon)</span>
        </div>
    </div>

    ${voiceSection}

    <div class="blockchain-footer">
        <div class="hosted-by">Hosted by <strong>Dr. Nalini Kanukurthy</strong></div>
        <div class="footer-row">
            <span><strong>Contract:</strong> ${escapeHtml(meta.contractAddress || "")}</span>
            <span><strong>Status:</strong> Permanently Witnessed</span>
        </div>
        <div>
            <strong>On-Chain Transaction Hash:</strong>
            <span class="tx-hash">${escapeHtml(meta.transactionHash || "")}</span>
        </div>
        <div style="margin-top:8px;">
            <a href="${meta.external_url}" style="color: var(--accent-gold);">Verify on PolygonScan &rarr;</a>
        </div>
    </div>
    `;
  }

  async function loadCertificate() {
    const tokenId = getTokenIdFromUrl();
    if (!tokenId) {
      showError("No certificate ID was provided in the link. Please check the link and try again.");
      return;
    }
    try {
      const indexRes = await fetch(`${METADATA_BASE_URL}index.json`);
      if (!indexRes.ok) throw new Error("Certificate index not found.");
      const index = await indexRes.json();

      const fileName = index[tokenId];
      if (!fileName) {
        showError(`No certificate exists for ID "${escapeHtml(tokenId)}".`);
        return;
      }

      const metaRes = await fetch(`${METADATA_BASE_URL}${fileName}`);
      if (!metaRes.ok) throw new Error("Certificate data could not be loaded.");
      const meta = await metaRes.json();

      renderCertificate(meta);
    } catch (err) {
      showError(`Something went wrong loading this certificate. (${err.message})`);
    }
  }

  loadCertificate();
</script>
</body>
</html>
